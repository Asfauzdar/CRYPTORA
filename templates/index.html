<script>

const BACKEND_URL = "https://cryptora-zn0f.onrender.com";

let enrollStream;
let decryptStream;


/* =========================
   CAMERA
========================= */

async function startCamera(videoId) {
    const video = document.getElementById(videoId);

    const stream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
    });

    video.srcObject = stream;

    return stream;
}


window.onload = async function () {

    try {

        enrollStream = await startCamera("enrollVideo");

        decryptStream = await startCamera("decryptVideo");

    } catch (error) {

        document.querySelectorAll(".camera-label").forEach(el => {

            el.innerHTML =
                '<span class="status-dot warning"></span> Camera permission needed';

        });

    }

};


/* =========================
   CAPTURE IMAGE
========================= */

function captureImage(videoId) {

    const video = document.getElementById(videoId);

    if (!video.videoWidth || !video.videoHeight) {

        throw new Error(
            "Camera is not ready yet. Please allow camera access and try again."
        );

    }

    const canvas = document.createElement("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const context = canvas.getContext("2d");

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return new Promise(resolve => {

        canvas.toBlob(
            blob => resolve(blob),
            "image/jpeg",
            0.9
        );

    });

}


/* =========================
   REGISTER RECIPIENT
========================= */

async function captureEnroll() {

    const username =
        document.getElementById("enrollUsername").value.trim();

    const status =
        document.getElementById("enrollStatus");


    if (!username) {

        status.innerText = "Please enter a username.";

        status.className = "status error";

        return;

    }


    try {

        const image =
            await captureImage("enrollVideo");


        const form = new FormData();

        form.append("username", username);

        form.append(
            "image",
            image,
            "face.jpg"
        );


        status.innerText =
            "Registering recipient...";

        status.className =
            "status pending";


        const response = await fetch(
            `${BACKEND_URL}/enroll`,
            {
                method: "POST",
                body: form
            }
        );


        const result =
            await response.json();


        status.innerText =
            result.success
                ? "✓ " + result.message
                : "✕ " + result.message;


        status.className =
            result.success
                ? "status success"
                : "status error";


    } catch (error) {

        console.error(error);

        status.innerText =
            "✕ Could not reach the CRYPTORA server.";

        status.className =
            "status error";

    }

}


/* =========================
   ENCRYPT DOCUMENT
========================= */

async function encryptDocument() {

    const file =
        document.getElementById("document").files[0];

    const recipients =
        document.getElementById("recipients").value.trim();

    const status =
        document.getElementById("encryptStatus");


    if (!file || !recipients) {

        status.innerText =
            "Please choose a document and add at least one recipient.";

        status.className =
            "status error";

        return;

    }


    const form =
        new FormData();


    form.append(
        "document",
        file
    );


    form.append(
        "recipients",
        recipients
    );


    status.innerText =
        "Encrypting document...";

    status.className =
        "status pending";


    try {

        const response =
            await fetch(
                `${BACKEND_URL}/encrypt`,
                {
                    method: "POST",
                    body: form
                }
            );


        const result =
            await response.json();


        if (result.success) {

            status.innerText =
                "✓ Encrypted successfully · ID: " +
                result.document_id;

            status.className =
                "status success";


            document.getElementById(
                "documentId"
            ).value =
                result.document_id;


            document.getElementById(
                "decryptUsername"
            ).value =
                recipients
                    .split(",")[0]
                    .trim();


        } else {

            status.innerText =
                "✕ " + result.message;

            status.className =
                "status error";

        }


    } catch (error) {

        console.error(error);

        status.innerText =
            "✕ Could not reach the server.";

        status.className =
            "status error";

    }

}


/* =========================
   DECRYPT DOCUMENT
========================= */

async function decryptDocument() {

    const documentId =
        document
            .getElementById("documentId")
            .value
            .trim();


    const username =
        document
            .getElementById("decryptUsername")
            .value
            .trim();


    const status =
        document.getElementById("decryptStatus");


    if (!documentId || !username) {

        status.innerText =
            "Enter the document ID and recipient username.";

        status.className =
            "status error";

        return;

    }


    try {

        const image =
            await captureImage("decryptVideo");


        const form =
            new FormData();


        form.append(
            "document_id",
            documentId
        );


        form.append(
            "username",
            username
        );


        form.append(
            "image",
            image,
            "face.jpg"
        );


        status.innerText =
            "Checking authorization and face...";

        status.className =
            "status pending";


        const response =
            await fetch(
                `${BACKEND_URL}/decrypt`,
                {
                    method: "POST",
                    body: form
                }
            );


        const result =
            await response.json();


        if (result.success) {

            status.innerText =
                "✓ Face verified · document decrypted · event " +
                result.event_id;

            status.className =
                "status success";


            const link =
                document.getElementById(
                    "downloadLink"
                );


            /*
             * Backend may return:
             * /download/filename
             *
             * Convert it into:
             * https://cryptora-zn0f.onrender.com/download/filename
             */

            if (result.download) {

                if (
                    result.download.startsWith("http")
                ) {

                    link.href =
                        result.download;

                } else {

                    link.href =
                        BACKEND_URL +
                        result.download;

                }

            }


            link.target = "_blank";

            link.style.display =
                "inline-flex";


        } else {

            status.innerText =
                "✕ " + result.message;

            status.className =
                "status error";


            document.getElementById(
                "downloadLink"
            ).style.display =
                "none";

        }


    } catch (error) {

        console.error(error);

        status.innerText =
            "✕ " + error.message;

        status.className =
            "status error";

    }

}


/* =========================
   AUDIT LEDGER
========================= */

async function loadAudit() {

    const audit =
        document.getElementById("audit");


    const summary =
        document.getElementById("auditSummary");


    audit.innerText =
        "Checking ledger...";


    try {

        const response =
            await fetch(
                `${BACKEND_URL}/audit`
            );


        const result =
            await response.json();


        audit.innerText =
            JSON.stringify(
                result,
                null,
                2
            );


        const valid =
            result.valid === true;


        summary.innerHTML =

            '<span class="audit-state ' +
            (valid ? "valid" : "invalid") +
            '">' +

            (
                valid
                    ? "✓ Ledger valid"
                    : "✕ Ledger check failed"
            ) +

            '</span>' +

            '<span>' +

            (
                valid
                    ? "Hash links are consistent."
                    : "Review the event chain for tampering."
            ) +

            '</span>';


    } catch (error) {

        console.error(error);


        audit.innerText =
            "Could not load the audit ledger.";


        summary.innerHTML =
            '<span class="audit-state invalid">' +
            '✕ Server unavailable' +
            '</span>';

    }

}

</script>
